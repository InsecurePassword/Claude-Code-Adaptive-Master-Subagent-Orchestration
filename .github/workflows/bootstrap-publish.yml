name: Publish complete Claude AMS package

on:
  push:
    branches:
      - bootstrap/full-package-upload
    paths:
      - _bootstrap/READY

permissions:
  contents: write

concurrency:
  group: claude-ams-bootstrap-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: bootstrap/full-package-upload
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/claude-ams-source"
          cat _bootstrap/chunks/chunk-* | base64 --decode > "$RUNNER_TEMP/claude-ams-source.zip"
          printf '%s  %s\n' \
            '9b9d420743ee18a2a2389ca248368cb1bbc0510db26cec47772eca720c1ac212' \
            "$RUNNER_TEMP/claude-ams-source.zip" | sha256sum --check --status
          unzip -q "$RUNNER_TEMP/claude-ams-source.zip" -d "$RUNNER_TEMP/claude-ams-source"
          source_root="$(find "$RUNNER_TEMP/claude-ams-source" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$source_root"
          printf '%s\n' "$source_root" > "$RUNNER_TEMP/source-root"

      - name: Replace placeholder with the complete source tree
        shell: bash
        run: |
          set -euo pipefail
          source_root="$(cat "$RUNNER_TEMP/source-root")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$source_root"/. .
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python scripts/validate_package.py --json
          python -m pytest -q
          git add -A
          git commit -m "Publish complete Claude AMS 1.0.0 source"
          git push origin main

      - name: Build and verify repository-hosted release artifacts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_release.py
          python scripts/verify_release.py
          git add -f dist/claude-ams-plugin-1.0.0.zip \
            dist/claude-ams-local-marketplace-1.0.0.zip \
            dist/Claude-Code-Adaptive-Master-Subagent-Orchestration-1.0.0-source.zip \
            dist/SHA256SUMS \
            dist/RELEASE-MANIFEST.json
          git commit -m "Add Claude AMS 1.0.0 release artifacts"
          git push origin main

      - name: Tag the verified release and remove the bootstrap branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git tag -f -a v1.0.0 -m "Claude AMS 1.0.0"
          git push origin refs/tags/v1.0.0 --force
          git push origin --delete bootstrap/full-package-upload
