name: Publish validated Claude AMS runtime

on:
  push:
    branches:
      - main
    paths:
      - "_bootstrap/runtime/READY"

permissions:
  contents: write

concurrency:
  group: claude-ams-runtime-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.head_commit.message == 'Trigger Claude AMS 1.0.1 runtime publication'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the publication payload
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify the validated runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_archive="$RUNNER_TEMP/claude-ams-runtime.tar.xz"
          runtime_root="$RUNNER_TEMP/claude-ams-runtime"
          cat _bootstrap/runtime/chunk-* | base64 --decode > "$runtime_archive"
          printf '%s  %s\n' \
            '77ae1f4d1fef2574935059cf98dee724d13a4985c2b3fa947eee4cb827b74bb5' \
            "$runtime_archive" | sha256sum --check --status
          mkdir -p "$runtime_root"
          tar -xJf "$runtime_archive" -C "$runtime_root"
          python -m json.tool "$runtime_root/.claude-plugin/marketplace.json" >/dev/null
          python -m json.tool "$runtime_root/.claude-plugin/plugin.json" >/dev/null
          test "$(cat "$runtime_root/VERSION")" = '1.0.1'
          test -f "$runtime_root/skills/ams/SKILL.md"
          test -f "$runtime_root/skills/ams/references/runtime-core.md"
          test -f "$runtime_root/agents/ams-worker.md"
          test -f "$runtime_root/INSTALLATION.md"

      - name: Replace the placeholder tree with the complete runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_root="$RUNNER_TEMP/claude-ams-runtime"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a "$runtime_root"/. .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Publish complete Claude AMS 1.0.1 custom marketplace'
          git push origin HEAD:main
